[package]
name = "differential-tui"
description = "Terminal reviewer for differential reading plans (the dfr review surface)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["diff", "git", "code-review", "tui"]
categories = ["command-line-interface", "development-tools"]

[dependencies]
differential-engine = { workspace = true }
anyhow = { workspace = true }
base64 = { workspace = true }
# `unstable-rendered-line-info` for `Paragraph::line_count`: a box sized by the
# paragraph that draws it, rather than by a second wrapper that disagrees.
ratatui = { version = "0.30", features = ["unstable-rendered-line-info"] }
crossterm = "0.29"
# Parses a `[keys]` string into the combination crossterm reports. No serde:
# the strings arrive as strings, and parsing them is `keymap`'s own step.
crokey = { version = "1.5", default-features = false }
similar = { version = "3", features = ["unicode"] }
syntect = "5"
two-face = { version = "0.5", default-features = false, features = ["syntect-default-fancy"] }
unicode-width = "0.2"
# Cutting text to a display width, by grapheme. Already in the tree through ratatui.
unicode-truncate = "2"
tui-textarea = { package = "tui-textarea-2", version = "0.13" }
# One-line input, state only: the search box composes its own row, so a widget
# that draws itself would have to be squeezed between the lead and the pill.
tui-input = { version = "0.15", default-features = false, features = ["crossterm"] }
arboard = "3"
palette = { workspace = true }
regex = { workspace = true }
textwrap = { version = "0.16", default-features = false, features = ["unicode-width"] }
pulldown-cmark = { version = "0.13", default-features = false }

[dev-dependencies]
differential-testutil = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
