# tmux, for one reason only: the demo video captions itself.
#
# A tape can type keys and nothing else, so a caption has to be something a
# KEYSTROKE can set. `ctrl-q` here opens tmux's command prompt and stores the
# words that follow in a user option; the status line draws that option and
# nothing else. The reviewer underneath never sees the key or the text.
#
# The prompt types INTO the status line, so the caption appears where it will
# live. One row of chrome, and it is the caption.

set -g status on
set -g status-position bottom
set -g status-justify left
set -g status-style "bg=colour236,fg=colour252"
set -g status-left " #{@cap} "
set -g status-left-length 300
set -g status-left-style "bg=colour148,fg=colour232,bold"
set -g status-right ""
setw -g window-status-format ""
setw -g window-status-current-format ""

# The command prompt wears the caption's own colours, so typing one looks like
# the caption arriving rather than like a dialog opening.
set -g message-style "bg=colour148,fg=colour232,bold"
set -g message-command-style "bg=colour148,fg=colour232,bold"

set -g escape-time 0
set -g default-terminal "xterm-256color"

# The opening caption, and what `record.vhs` waits for before it types.
set -g @cap "a reading plan for a diff"

# One root binding, and the prefix unbound: tmux intercepts ctrl-q and passes
# every other key through to the reviewer.
#
# The old caption is cleared BEFORE the prompt opens, and the redraw is forced
# between the two. The prompt draws over status-left and does not clear the
# rest of the line, so without the clear a short caption being typed leaves the
# tail of the long one beside it — and without the refresh the clear does not
# reach the screen before the prompt covers it.
unbind C-b
bind-key -n C-q set -g @cap '' \; refresh-client -S \; command-prompt -p "" "set -g @cap '%%'"
